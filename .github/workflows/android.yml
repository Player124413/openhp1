name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OpenHP1 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        run: |
          echo "Checking available NDKs in $ANDROID_HOME/ndk..."
          if [ -d "$ANDROID_HOME/ndk" ] && [ "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            SELECTED_NDK=$(ls -1d "$ANDROID_HOME/ndk/"* | sort -V | tail -n 1)
            echo "Found installed NDK: $SELECTED_NDK"
          else
            echo "Installing NDK via sdkmanager..."
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264"
            SELECTED_NDK="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "ANDROID_NDK_HOME=$SELECTED_NDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SELECTED_NDK" >> "$GITHUB_ENV"
          echo "Selected NDK: $SELECTED_NDK"

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked || cargo install cargo-ndk
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android Libraries and APK
        run: |
          chmod +x ./scripts/build-android.sh
          BUILD_ALL_ABIS=1 ./scripts/build-android.sh

      - name: Verify APK
        run: |
          echo "Checking built APK files..."
          ls -la android/app/build/outputs/apk/release/ || ls -la android/app/build/outputs/apk/debug/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhp1-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
