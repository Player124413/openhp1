name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OpenHP1 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        run: |
          echo "Checking available NDKs in $ANDROID_HOME/ndk..."
          if [ -d "$ANDROID_HOME/ndk" ] && [ "$(ls -A "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            SELECTED_NDK=$(ls -1d "$ANDROID_HOME/ndk/"* | sort -V | tail -n 1)
            echo "Found installed NDK: $SELECTED_NDK"
          else
            echo "Installing NDK via sdkmanager..."
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264"
            SELECTED_NDK="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          echo "ANDROID_NDK_HOME=$SELECTED_NDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SELECTED_NDK" >> "$GITHUB_ENV"
          echo "Selected NDK: $SELECTED_NDK"

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked || cargo install cargo-ndk
          fi

      - name: Install Gradle 8.5
        run: |
          echo "Downloading Gradle 8.5..."
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          sudo unzip -q -o gradle-8.5-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.5/bin" >> "$GITHUB_PATH"
          echo "PATH=/opt/gradle/gradle-8.5/bin:$PATH" >> "$GITHUB_ENV"
          rm -f gradle-8.5-bin.zip

      - name: Verify Gradle
        run: |
          export PATH="/opt/gradle/gradle-8.5/bin:$PATH"
          gradle --version

      - name: Build Android Libraries and APK
        run: |
          set -o pipefail
          export PATH="/opt/gradle/gradle-8.5/bin:$PATH"
          chmod +x ./scripts/build-android.sh
          BUILD_ALL_ABIS=1 ./scripts/build-android.sh 2>&1 | tee build.log

      - name: Save and Push Build Log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-debug || git checkout -B ci-debug
          git rm -rf . || true
          cp build.log ci-build.log || echo "no build.log" > ci-build.log
          git add ci-build.log
          git commit -m "CI Build Log" || true
          git push -f origin ci-debug || true

      - name: Verify and List APK
        run: |
          echo "Checking built APK files..."
          ls -la android/app/build/outputs/apk/release/ || ls -la android/app/build/outputs/apk/debug/ || true
          echo "### Build Success" >> "$GITHUB_STEP_SUMMARY"
          echo "APK successfully generated:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find android/app/build/outputs/apk -name "*.apk" -ls >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhp1-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
