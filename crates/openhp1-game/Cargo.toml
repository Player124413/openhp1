[package]
name = "openhp1-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "openhp1_game"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "openhp1-game"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
glam.workspace = true
openhp1-audio = { path = "../openhp1-audio", features = ["playback"] }
openhp1-package = { path = "../openhp1-package" }
openhp1-render = { path = "../openhp1-render" }
openhp1-runtime = { path = "../openhp1-runtime" }
openhp1-scene = { path = "../openhp1-scene" }
openhp1-texture = { path = "../openhp1-texture" }
pollster.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true
winit.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
